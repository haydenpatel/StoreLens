<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Before JS runs (and for the media query alone) each follows the OS. They
         come before the script below so its loop finds them: it points both at
         the saved theme, and applyThemeColor keeps them in step afterwards. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <!-- Applies the theme before first paint so there is no flash of the wrong
         one, and points both theme-color metas (the colours of the page
         background) at it. Keep in step with src/lib/theme.js (key, rules and
         colours); theme.test.js runs this exact script against it. If a
         Content-Security-Policy is ever added, this inline script needs a
         sha256 hash (or move it to a file). -->
    <script>
      (function () {
        var p = null;
        try { p = localStorage.getItem("storelens-theme"); } catch (e) {}
        var dark = p === "dark" || (p !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#09090b" : "#ffffff");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/StoreLens-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Semi+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoreLens</title>
  </head>
  <body>
    <noscript style="display:block;padding:16px;font-family:sans-serif">StoreLens needs JavaScript to load a store's products. Please turn it on and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
